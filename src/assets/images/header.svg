<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Nitish Kumar Sah" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <style>
      .title { font: 700 54px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; animation: fade 1.4s ease-out both; }
      .sub   { font: 400 19px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8fd3f4; animation: fade 2s ease-out both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <rect width="1000" height="220" rx="14" fill="url(#bg)"/>
  <circle cx="900" cy="40" r="90" fill="#36bcf7" opacity="0.07"/>
  <circle cx="120" cy="200" r="110" fill="#36bcf7" opacity="0.06"/>
  <text x="500" y="102" text-anchor="middle" class="title">Nitish Kumar Sah</text>
  <text x="500" y="146" text-anchor="middle" class="sub">I make backends fast, secure &amp; boringly reliable</text>
</svg>
